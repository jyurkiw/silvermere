[package]
name = "silvermere-content"
description = "The fork's own content (content/*.toml): read, checked, and installed into the database at every start."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# one test binary for all of tests/ (tests/all.rs), not one per file (T-129)
autotests = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
silvermere-db.workspace = true
silvermere-text.workspace = true
silvermere-types.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["any"] }
tokio.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
