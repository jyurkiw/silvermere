# The Avenger (design/stealth-casters.md): a fighter-leaning stealth priest who opens with
# a spell from the shadows and can vanish again mid-fight.
[[class]]
number   = 18
name     = "Avenger"
hp       = "4-8"
exp      = 200
magic    = "Priest-1"
fighting = 3
weapons  = "AnyBlunt"
armour   = "StuddedRigidLeather"
abilities = [
  { name = "ClassStealth" },
  { name = "BackstabMin",          value = 5 },
  { name = "BackstabMax",          value = 5 },
  { name = "SpellBackstab",        value = 100 }, # damage raise, percent
  { name = "SpellBackstabStealth", value = 20 },  # stealth roll penalty; hidden
  { name = "Vanish",               value = 20 },  # hide chance penalty
  { name = "BluntBackstab" },
]

