# The fork's classes, installed into the database at every server start
# (design/content-overlay.md). Stats are written as the class help shows them.

# The War Mage (design/war-mage.md).
[[class]]
number   = 16
name     = "War Mage"
hp       = "5-9"          # HP per level
exp      = 220            # percent; a Warrior is 100
magic    = "Mage-1"
fighting = 4              # 1-5; a Warrior is 4
weapons  = "All"
armour   = "Chainmail"
abilities = [
  { name = "Bash" },
  { name = "Spellstrike",           value = 30 },  # base failure discount, percent
  { name = "SpellstrikeSuccessOff", value = 10 },  # hidden
  { name = "SpellstrikeFailOff",    value = 40 },  # hidden
  { name = "NoOffHand" },
]

