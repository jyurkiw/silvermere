# The fork's HELP topics, added to the game's own when the server loads its text.

[[class_topic]]
class = "War Mage"
words = "War Mages"
text = '''
War Mages are the soldiers of the King's Battle-Mage corps who would rather not keep a
hand free. Where their warlock comrades direct their spells from an open hand, War Mages
drive the magic through their weapon at close range, striking with blade and spell in the
same moment. They fight as well as any warrior and wear chainmail, but the weapon takes
both their hands and their attention: they carry no shield, and their command of magic
is the most basic of the Mage arts.

In combat, a War Mage who casts an attack spell with a weapon in hand makes a
Spellstrike: the spell takes the place of the first blow, the rest of the round is
fought as normal, and a spell that fails is no worse than a missed blow.
'''
abilities = "Spellstrike."

[[topic]]
words = "Spellstrike"
text = '''
Spellstrike

A War Mage who casts a single-target attack spell in combat with a weapon wielded
channels the spell through the weapon. The cast takes the place of the round's first
blow and costs the energy of one blow, less a discount; the rest of the round's energy
buys blows as usual. A failed cast counts as a missed blow and costs less than a success.

Out of mana, the fight carries on as plain melee until you CAST again. Area spells, and
casting with no weapon in hand, work as they always have.
'''

[[class_topic]]
class = "Warden"
words = "Wardens"
text = '''
Wardens keep the wild places beyond the walls, and none of them walks alone. Each is bonded
to an animal companion: a hunting hound, a hawkling, a trained rattlesnake or, for the
brave, a drop bear. Warden and companion fight as one, and share one life between them.

Wardens are hardy rather than skilled: they swing less often than a warrior, but their
companion's strike comes every round and lands hard. They fight with two-handed and
ranged weapons and travel light, in leather; seasoned Wardens may take to chainmail, and
veterans to scale. A new Warden finds the stable in Newhaven, chooses a companion's leash
there and uses it to bond.
'''
abilities = "Animal companion, ranged weapons."

[[topic]]
words = "Companions"
text = '''
Companions

A Warden's companion fights beside them. Each round, after the Warden's own blows, it
strikes the Warden's foe on its own: a hunting hound once, a hawkling several times for
less, a trained rattlesnake once with a poisoned bite, and a drop bear every other round
with great force. Its strength grows with the Warden's level. It shares the Warden's life
and needs no gear.

Choose a companion at the Newhaven stable: get its leash there and USE it in the stable.
PET shows your companion; PET NAME <name> names it.
'''
