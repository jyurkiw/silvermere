# The fork's HELP topics, added to the game's own when the server loads its text.

[[class_topic]]
class = "War Mage"
words = "War Mages"
text = '''
War Mages are the soldiers of the King's Battle-Mage corps who would rather not keep a
hand free. Where their warlock comrades direct their spells from an open hand, War Mages
drive the magic through their weapon at close range, striking with blade and spell in the
same moment. They fight as well as any warrior and wear chainmail, but the weapon takes
both their hands and their attention: they carry no shield, and their command of magic
is the most basic of the Mage arts.

In combat, a War Mage who casts an attack spell with a weapon in hand makes a
Spellstrike: the spell takes the place of the first blow, the rest of the round is
fought as normal, and a spell that fails is no worse than a missed blow.
'''
abilities = "Spellstrike."

[[topic]]
words = "Spellstrike"
text = '''
Spellstrike

A War Mage who casts a single-target attack spell in combat with a weapon wielded
channels the spell through the weapon. The cast takes the place of the round's first
blow and costs the energy of one blow, less a discount; the rest of the round's energy
buys blows as usual. A failed cast counts as a missed blow and costs less than a success.

Out of mana, the fight carries on as plain melee until you CAST again. Area spells, and
casting with no weapon in hand, work as they always have.
'''

[[class_topic]]
class = "Warden"
words = "Wardens"
text = '''
Wardens keep the wild places beyond the walls, and none of them walks alone. Each is bonded
to an animal companion: a hunting hound, a hawkling, a trained rattlesnake or, for the
brave, a drop bear. Warden and companion fight as one, and share one life between them.

Wardens are hardy rather than skilled: they swing less often than a warrior, but their
companion's strike comes every round and lands hard. They fight with two-handed and
ranged weapons and travel light, in leather; seasoned Wardens may take to chainmail, and
veterans to scale. A new Warden finds the stable in Newhaven, chooses a companion's leash
there and uses it to bond.
'''
abilities = "Animal companion, ranged weapons."

[[topic]]
words = "Companions"
text = '''
Companions

A Warden's companion fights beside them. Each round, before the Warden's own blows, it
strikes the Warden's foe on its own: a hunting hound once, a hawkling several times for
less, a trained rattlesnake once with a poisoned bite, and a drop bear every other round
with great force. Its strength grows with the Warden's level. It shares the Warden's life
and needs no gear.

Choose a companion at the Newhaven stable: get its leash there and USE it in the stable.
PET shows your companion; PET NAME <name> names it.
'''

[[class_topic]]
class = "Avenger"
words = "Avengers"
text = '''
When a temple names someone an enemy of the faith and no court will touch them, it sends
an Avenger. Avengers are priests who learned to walk unseen: they carry no holy symbol
openly and wear no vestments, only dark leather and a mace. Good temples send them after
the cruel and the powerful; evil temples send them after everyone else.

An Avenger fights well enough face to face, but its art is to strike, vanish and strike
again before its quarry knows where the blows are coming from. From hiding, its attack
spells land as backstabs; in a fight it can VANISH back into the shadows; and it can
backstab with any blunt weapon.
'''
abilities = "Stealth, backstab, spell backstab, vanish."

[[topic]]
words = "Spell Backstab"
text = '''
Spell Backstab

An Avenger or an Assassin who casts a single-target attack spell from hiding or
sneaking strikes from the shadows. Two things must go right: the caster must stay unseen
while the spell is spoken (harder than sneaking, since casting is not quiet), and the
spell must be cast. If both do, the spell lands as a backstab, for far more damage. If
the foe spots the caster first, the spell is an ordinary cast. Either way the caster is
revealed and the fight is on.
'''

[[topic]]
words = "Vanish"
text = '''
Vanish

VANISH, in the middle of a fight, lets an Avenger slip back into hiding. It takes the
round, and it is harder than hiding when no one is looking. If it works, the Avenger's
foes lose sight of it and the Avenger can strike again from the shadows, with a backstab
or a spell. An Avenger can try to vanish once every five rounds.
'''

[[class_topic]]
class = "Assassin"
words = "Assassins"
text = '''
The Assassins learned their magic the way they learned their knives: from someone who
expected to be paid for it. A mage would call their spellcraft crude, and it is: a
handful of killing words and nothing else. But spoken from the dark, at someone who never
knew they were there, a crude spell is enough.

An Assassin fights well enough with a blade, but its first strike is the one that
matters, and it is as likely to be a bolt of force as a knife. From hiding, its attack
spells land as backstabs.
'''
abilities = "Stealth, backstab, spell backstab."

[[class_topic]]
class = "Dervish"
words = "Dervishes"
text = '''
The Dervishes come out of the desert dancing. Their fighting is a spinning dance taught in
the desert lodges, two blades turning around the dancer. They wear nothing heavier than
leather, because a dancer in mail can't turn, and they trust neither shields ("the second
blade is the shield") nor bows.

A Dervish fights with a one-handed weapon in each hand, and each hand strikes on its own,
so a Dervish's foe faces more blows than any other fighter could land. WIELD a weapon, then
OFFHAND a second.
'''
abilities = "Dual wielding."

[[topic]]
words = "Offhand"
text = '''
Offhand

OFFHAND <weapon> puts a second one-handed melee weapon in a Dervish's off-hand. A weapon
must be wielded in the main hand first. In combat each hand strikes in turn, with its own
weapon's speed and damage, and each hand strikes at least once a round, up to eight blows a
round between them. The off-hand is a little less accurate. REMOVE takes the off-hand
weapon off; if the main-hand weapon goes, the off-hand weapon moves to the main hand.
'''
