# Corra Hale: ASK CORRA ABOUT LEASHES; greeting.
[[text]]
number = 20100
text = """
LEASH:20101
PET:20101
COMPANION:20101
BEAST:20101
"""
link = 20102

[[text]]
number = 20101
text = """
Corra Hale sounds her whistle once, and the yard falls quiet. "Leashes? You'll
find the plain ones inside: hounds, hawklings, rattlesnakes and drop bears,
the same as the Newhaven stable gives away, but here you pay for them. Then
there are the better beasts. A war hound, a gyrfalcon, a desert viper, a cave
bear, a shadow mastiff: each a little better than its cousin, and priced like
it. The gyrfalcon and the mastiff can even hurt the things that only magic
hurts."

"A leash binds only when it's used in a Warden Stables, like ours. Use a new
one and your old beast stays here with us; the new one comes to you without a
name."
"""

[[text]]
number = 20102
text = """
Corra Hale gives you a quick nod and goes back to watching the yard.
"""

